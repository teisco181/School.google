<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Agent Hub - Startpagina</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        text-align: center;
      }
      .card {
        background: #1e293b;
        padding: 36px 28px;
        border-radius: 24px;
        border: 1px solid #334155;
        max-width: 460px;
        width: 100%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }
      .logo {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        border-radius: 16px;
        border: 1px solid #334155;
      }
      h2 {
        margin: 0 0 10px 0;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 20px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 14px;
        font-weight: 600;
        font-size: 15px;
        box-sizing: border-box;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .btn:hover {
        background: #1d4ed8;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .status-text {
        font-size: 12px;
        color: #64748b;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
      </div>
      <h2>Google Agent Hub</h2>
      <p id="msg">
        Je bevindt je op de GitHub subpagina. Klik op de knop om direct naar de hoofdstartpagina te gaan.
      </p>
      <a id="start-btn" href="./" class="btn">
        🚀 Open Startpagina
      </a>
      <div id="redirect-info" class="status-text">
        Automatisch doorverbinden...
      </div>
    </div>

    <script>
      (function() {
        // Bereken het werkelijke startadres van de GitHub repository
        function calculateStartUrl() {
          var loc = window.location;
          var origin = loc.origin;
          var path = loc.pathname;
          var segments = path.split('/').filter(Boolean);

          // Als we op username.github.io/reponaam/ zitten:
          if (loc.hostname.indexOf('github.io') !== -1 && segments.length > 0) {
            // Eerste segment is de repositorynaam (bijv. 'School.google')
            var repoName = segments[0];
            return origin + '/' + repoName + '/';
          }
          return origin + '/';
        }

        var startUrl = calculateStartUrl();
        var btn = document.getElementById('start-btn');
        if (btn) {
          btn.href = startUrl;
          btn.onclick = function(e) {
            e.preventDefault();
            window.location.replace(startUrl);
          };
        }

        // Als de URL '/dist/' of een 404 submap bevat, stuur automatisch direct door
        if (window.location.pathname.indexOf('/dist') !== -1 || window.location.pathname.indexOf('404') !== -1) {
          setTimeout(function() {
            window.location.replace(startUrl);
          }, 300);
        } else {
          var info = document.getElementById('redirect-info');
          if (info) info.style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
